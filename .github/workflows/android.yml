name: Android CI

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'settings.gradle'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write google-services.json
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$JSON_CONTENT" ]; then
            printf '%s' "$JSON_CONTENT" > app/google-services.json
          else
            # Dummy biar build jalan walau di fork belum set secret
            cat > app/google-services.json <<'EOF'
            {
              "project_info": {
                "project_number": "000000000000",
                "project_id": "dummy",
                "storage_bucket": "dummy.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                    "android_client_info": { "package_name": "com.besome.sketch" }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "dummy" }],
                  "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Build Release APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: gradle assembleRelease --warning-mode all

      - name: Pack APK + DEX to ZIP
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK: $APK"
          mkdir -p out
          cp "$APK" out/app-release.apk
          cd out
          # DEX ada di dalam APK, extract aja
          unzip -o app-release.apk "*.dex"
          zip -r release.zip app-release.apk *.dex
          ls -lh

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: out/release.zip