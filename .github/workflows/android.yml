name: Android CI

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: gradle assembleRelease

      - name: Pack APK + DEX to ZIP
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p out/dex
          # Extract semua .dex dari dalam APK
          unzip -j "$APK" "*.dex" -d out/dex
          cp "$APK" out/app-release.apk
          cd out && zip -r ../app-release-${GITHUB_SHA::7}.zip app-release.apk dex/
          cd ..

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.sha }}
          path: app-release-*.zip