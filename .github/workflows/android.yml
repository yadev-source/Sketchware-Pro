name: Android CI

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  notifyTelegram:
    if: ${{ !startsWith(github.ref, 'refs/heads/wip/') }}
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Send a message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          python ./.github/workflows/notify_telegram.py
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 2   # perlu HEAD~1 untuk git diff filter kelas

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf 'GOOGLE_SERVICES_JSON<<EOF\n%s\nEOF\n' "$JSON_CONTENT" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: gradle assembleRelease

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APK with commit hash
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      # ───────────── TAMBAHAN 1: Ekstrak semua DEX ─────────────
      - name: Extract DEX files from APK
        run: |
          APK="app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk"
          mkdir -p dex_output
          unzip -o "$APK" "classes*.dex" -d dex_output
          echo "=== DEX files ==="
          ls -la dex_output/
          [ -n "$(ls -A dex_output)" ] || { echo "Tidak ada DEX!"; exit 1; }

      # ───────────── TAMBAHAN 2: Kumpulkan classes.jar ─────────────
      - name: Collect classes.jar (pre-R8)
        run: |
          mkdir -p jar_output
          find app/build/intermediates -type f -name "classes.jar" \
            -path "*/release/*" -exec cp -v {} jar_output/ \;

          if [ -z "$(ls -A jar_output 2>/dev/null)" ]; then
            echo "Fallback: cari di seluruh intermediates..."
            find app/build/intermediates -type f -name "classes.jar" \
              -exec cp -v {} jar_output/ \;
          fi

          echo "=== JAR files ==="
          ls -la jar_output/ 2>/dev/null || echo "(kosong)"

      # ───────────── TAMBAHAN 2b: Filter hanya kelas yang diedit ─────────────
      - name: Filter classes.jar to only changed classes
        run: |
          set -uo pipefail
          mkdir -p jar_changed

          # 1) Daftar source yang berubah di commit terakhir
          git diff --name-only HEAD~1 HEAD -- '*.java' '*.kt' > /tmp/changed_src.txt 2>/dev/null || true
          echo "=== Source berubah ==="
          cat /tmp/changed_src.txt || true

          if [ ! -s /tmp/changed_src.txt ]; then
            echo "ℹ️ Tidak ada source berubah — salin classes.jar apa adanya."
            cp jar_output/*.jar jar_changed/ 2>/dev/null || true
            ls -la jar_changed/ || true
            exit 0
          fi

          # 2) Path source → nama kelas (tanpa .class)
          > /tmp/class_patterns.txt
          while IFS= read -r src; do
            [[ -z "$src" ]] && continue
            [[ "$src" =~ /src/(main|debug|release)/(java|kotlin)/ ]] || continue
            # Ambil bagian setelah .../java/ atau .../kotlin/
            rel=$(echo "$src" | sed -E 's#^.*/src/(main|debug|release)/(java|kotlin)/##')
            cls="${rel%.java}"; cls="${cls%.kt}"
            [ -n "$cls" ] && echo "$cls" >> /tmp/class_patterns.txt
          done < /tmp/changed_src.txt

          echo "=== Class patterns ==="
          cat /tmp/class_patterns.txt

          if [ ! -s /tmp/class_patterns.txt ]; then
            echo "ℹ️ Source berubah tidak berada di src/main — salin semua."
            cp jar_output/*.jar jar_changed/ 2>/dev/null || true
            ls -la jar_changed/ || true
            exit 0
          fi

          # 3) Filter tiap classes.jar
          shopt -s nullglob
          for jar in jar_output/*.jar; do
            jar_name=$(basename "$jar" .jar)
            out_name="${jar_name}-changed.jar"
            tmp=$(mktemp -d)
            unzip -q "$jar" -d "$tmp"

            staging="$(mktemp -d)"
            matched=0

            while IFS= read -r -d '' cf; do
              cpath="${cf#$tmp/}"
              cname="${cpath%.class}"
              keep=false
              while IFS= read -r p; do
                case "$cname" in
                  "$p"|"$p"\$*|"${p}Kt"|"${p}Kt"\$*) keep=true; break ;;
                esac
              done < /tmp/class_patterns.txt

              if [ "$keep" = true ]; then
                mkdir -p "$staging/$(dirname "$cpath")"
                cp "$cf" "$staging/$cpath"
                matched=$((matched+1))
              fi
            done < <(find "$tmp" -name '*.class' -print0)

            if [ "$matched" -gt 0 ]; then
              ( cd "$staging" && jar cf "$OLDPWD/jar_changed/$out_name" . )
              echo "✅ $out_name dibuat ($matched kelas cocok)"
            else
              echo "⚠️ Tidak ada kelas cocok untuk $jar_name — skip."
            fi

            rm -rf "$tmp" "$staging"
          done

          # Fallback: kalau filter kosong, salin full jar
          if [ -z "$(ls -A jar_changed/*.jar 2>/dev/null)" ]; then
            echo "⚠️ Hasil filter kosong — fallback ke classes.jar penuh."
            cp jar_output/*.jar jar_changed/ 2>/dev/null || true
          fi

          echo "=== Hasil ==="
          ls -la jar_changed/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      # ───────────── TAMBAHAN 3: Upload DEX & JAR ─────────────
      - name: Upload DEX
        uses: actions/upload-artifact@v7
        with:
          name: classes-dex-${{ steps.set_sha.outputs.short_sha }}
          path: dex_output/*.dex
          if-no-files-found: error

      - name: Upload classes.jar (full, pre-R8)
        uses: actions/upload-artifact@v7
        with:
          name: classes-jar-${{ steps.set_sha.outputs.short_sha }}
          path: jar_output/*.jar
          if-no-files-found: warn

      - name: Upload classes.jar (changed only)
        uses: actions/upload-artifact@v7
        with:
          name: classes-jar-changed-${{ steps.set_sha.outputs.short_sha }}
          path: jar_changed/*.jar
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  aggregateAndSend:
    if: ${{ !startsWith(github.ref, 'refs/heads/wip/') }}
    name: Send APKs to Telegram
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./downloaded-artifact

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install telethon

      - name: Get Git Commit Info
        run: |
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Restore Telegram session cache
        uses: actions/cache@v5
        id: telegram_session_cache
        with:
          path: bot_session.session
          key: telegram-session-${{ runner.os }}-bot_session

      - name: Send APKs to Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          APK_PATH: ./downloaded-artifact/app-release-${{ needs.build.outputs.short_sha }}.apk
        run: |
          python ./.github/workflows/deploy_artifacts.py
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  updateAppData:
    if: ${{ !startsWith(github.ref, 'refs/heads/wip/') }}
    name: Update App Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Pakai PAT agar push benar-benar berhasil
          token: ${{ secrets.GH_ABOUT_APP_WORKFLOW_TOKEN }}

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Update App Script
        run: python .github/workflows/update_app_data.py

      - name: Commit and Push Changes
        run: |
          git checkout host
          git config --global user.name "Sketchware Pro Actions"
          git config --global user.email "hello@sketchware.pro"
          git add about.json
          git commit -m "feat: Update app about screen data"
          git push
        continue-on-error: true