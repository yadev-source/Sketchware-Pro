name: Android CI

on:
  workflow_dispatch:
    inputs:
      branch_note:
        description: "Catatan bebas (muncul di log)"
        type: string
        default: ""

jobs:
  build:
    name: Build APK + classes.zip
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Print manual run note
        run: echo "Manual run note: ${{ inputs.branch_note }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf 'GOOGLE_SERVICES_JSON<<EOF\n%s\nEOF\n' "$JSON_CONTENT" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: gradle assembleRelease

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APK with commit hash
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      # ───── Ekstrak DEX dari APK ─────
      - name: Extract DEX from APK
        run: |
          APK="app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk"
          mkdir -p classes_zip_out/dex
          unzip -o "$APK" "classes*.dex" -d classes_zip_out/dex
          [ -n "$(ls -A classes_zip_out/dex)" ] || { echo "Tidak ada DEX!"; exit 1; }
          echo "=== DEX ==="
          ls -la classes_zip_out/dex/

      # ───── Kumpulkan classes.jar (pre-R8) ─────
      - name: Collect classes.jar
        run: |
          mkdir -p classes_zip_out/jar
          find app/build/intermediates -type f -name "classes.jar" \
            -path "*/release/*" -exec cp -v {} classes_zip_out/jar/ \; || true

          if [ -z "$(ls -A classes_zip_out/jar 2>/dev/null)" ]; then
            echo "Fallback: cari di seluruh intermediates..."
            find app/build/intermediates -type f -name "classes.jar" \
              -exec cp -v {} classes_zip_out/jar/ \; || true
          fi

          echo "=== JAR ==="
          ls -la classes_zip_out/jar/ 2>/dev/null || echo "(kosong)"

      # ───── Bungkus jadi classes.zip ─────
      - name: Pack classes.zip
        run: |
          cd classes_zip_out
          zip -r "../classes-${{ steps.set_sha.outputs.short_sha }}.zip" dex jar
          cd ..
          ls -la "classes-${{ steps.set_sha.outputs.short_sha }}.zip"

      # ───── Upload artifacts ─────
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload classes.zip
        uses: actions/upload-artifact@v7
        with:
          name: classes-zip-${{ steps.set_sha.outputs.short_sha }}
          path: classes-${{ steps.set_sha.outputs.short_sha }}.zip
          if-no-files-found: error